name: FGH-Renew-Auto

on:
  workflow_dispatch:
  schedule:
    # 每天按预定时间执行 (UTC时间)
    - cron: '30 2,6,10,14,18,22 * * *'

jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    steps:
      - name: 🟢 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ 安装系统依赖与 Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb curl unzip

      - name: 📥 拉取私库代码 (kanezikii/fgh_Renew)
        run: |
          git clone https://x-access-token:${{ secrets.PRIVATE_PAT }}@github.com/kanezikii/fgh_Renew.git private_repo
          cd private_repo
          npm init -y
          npm install puppeteer-real-browser

      - name: 🚀 部署并启动全协议本地代理 (Mihomo)
        env:
          RAW_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          python3 - << 'EOF'
          import os, sys, json, base64, urllib.parse

          raw = os.environ.get("RAW_CONFIG", "").strip()
          if not raw:
              sys.exit(0)

          if '"outbounds"' in raw or "proxies:" in raw:
              with open("config.yaml", "w", encoding="utf-8") as f:
                  f.write(raw)
              sys.exit(0)

          proxy = None
          if raw.startswith("vless://"):
              u = urllib.parse.urlsplit(raw)
              q = urllib.parse.parse_qs(u.query)
              net_type = q.get("type", ["tcp"])[0].lower()
              sec = q.get("security", ["none"])[0].lower()
              sni = q.get("sni", [""])[0] or u.hostname
              host = q.get("host", [""])[0] or sni
              path = urllib.parse.unquote(q.get("path", ["/"])[0])
              
              proxy = {
                  "name": "AUTO_PROXY",
                  "type": "vless",
                  "server": u.hostname,
                  "port": int(u.port or 443),
                  "uuid": u.username,
                  "cipher": "auto",
                  "udp": True,
                  "tls": sec in ["tls", "reality"],
                  "skip-cert-verify": True,
                  "servername": sni,
                  "network": net_type
              }
              if sec == "reality":
                  proxy["reality-opts"] = {
                      "public-key": q.get("pbk", [""])[0],
                      "short-id": q.get("sid", [""])[0]
                  }
                  proxy["client-fingerprint"] = q.get("fp", ["chrome"])[0]
              if net_type == "ws":
                  proxy["ws-opts"] = {"path": path, "headers": {"Host": host}}
              elif net_type == "grpc":
                  proxy["grpc-opts"] = {"grpc-service-name": q.get("serviceName", [""])[0]}

          elif raw.startswith("vmess://"):
              b64_str = raw[8:] + "=" * ((4 - len(raw[8:]) % 4) % 4)
              d = json.loads(base64.b64decode(b64_str).decode("utf-8"))
              net_type = d.get("net", "tcp").lower()
              host = d.get("host", "") or d.get("add", "")
              path = d.get("path", "/")
              tls = d.get("tls") in ["tls", "1", True]
              proxy = {
                  "name": "AUTO_PROXY",
                  "type": "vmess",
                  "server": d.get("add"),
                  "port": int(d.get("port")),
                  "uuid": d.get("id"),
                  "alterId": int(d.get("aid", 0)),
                  "cipher": "auto",
                  "udp": True,
                  "tls": tls,
                  "skip-cert-verify": True,
                  "servername": d.get("sni", "") or host,
                  "network": net_type
              }
              if net_type == "ws":
                  proxy["ws-opts"] = {"path": path, "headers": {"Host": host}}
              elif net_type == "grpc":
                  proxy["grpc-opts"] = {"grpc-service-name": path}

          elif raw.startswith("hysteria2://") or raw.startswith("hy2://"):
              u = urllib.parse.urlsplit(raw)
              q = urllib.parse.parse_qs(u.query)
              proxy = {
                  "name": "AUTO_PROXY",
                  "type": "hysteria2",
                  "server": u.hostname,
                  "port": int(u.port or 443),
                  "password": u.username or u.password or "",
                  "sni": q.get("sni", [u.hostname])[0],
                  "skip-cert-verify": True,
                  "udp": True
              }

          elif raw.startswith("ss://"):
              u = urllib.parse.urlsplit(raw)
              if "@" in raw[5:]:
                  userinfo = u.username + "=" * ((4 - len(u.username) % 4) % 4)
                  method, password = base64.b64decode(userinfo).decode("utf-8").split(":", 1)
                  server, port = u.hostname, u.port
              else:
                  raw_b64 = u.netloc + "=" * ((4 - len(u.netloc) % 4) % 4)
                  decoded = base64.b64decode(raw_b64).decode("utf-8")
                  userinfo, hostport = decoded.split("@", 1)
                  method, password = userinfo.split(":", 1)
                  server, port = hostport.split(":", 1)
              proxy = {
                  "name": "AUTO_PROXY",
                  "type": "ss",
                  "server": server,
                  "port": int(port),
                  "cipher": method,
                  "password": password,
                  "udp": True
              }

          if proxy:
              cfg = {
                  "mixed-port": 10808,
                  "allow-lan": False,
                  "mode": "rule",
                  "log-level": "info",
                  "ipv6": False,
                  "proxies": [proxy],
                  "proxy-groups": [
                      {"name": "GLOBAL_PROXY", "type": "select", "proxies": ["AUTO_PROXY"]}
                  ],
                  "rules": ["MATCH,GLOBAL_PROXY"]
              }
              with open("config.json", "w", encoding="utf-8") as f:
                  json.dump(cfg, f, indent=2)
              print("✅ 代理参数已构建，已显式关闭 IPv6！")
          EOF

          curl -sL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-linux-amd64-v1.19.2.gz | gzip -d > ./mihomo
          chmod +x ./mihomo
          CONFIG_FILE=$(ls config.json config.yaml 2>/dev/null | head -n 1)

          if [ -n "$CONFIG_FILE" ]; then
              nohup ./mihomo -d . -f "$CONFIG_FILE" > proxy.log 2>&1 &
              sleep 4
              TEST_IP=$(curl -s --socks5 127.0.0.1:10808 -m 8 https://api.ip.sb/ip || true)
              if [ -n "$TEST_IP" ]; then
                  echo "🌐 本地代理正常出网，节点出口 IP: $TEST_IP"
              else
                  echo "⚠️ 代理测试未通过，查看日志："
                  cat proxy.log
              fi
          fi

      - name: 🚀 执行核心自动化脚本
        env:
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
          SERVER_ID: '5f39d742'
        run: |
          cd private_repo
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1600x24" node fgh_renew.js

      - name: 💾 同步最新 Cookie 回写至私有仓库
        if: always()
        run: |
          cd private_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet fgh_renew.js; then
            echo "🔄 检测到 Cookie 发生变动，自动同步到私库..."
            git add fgh_renew.js
            git commit -m "Auto: Update cookies [skip ci]"
            git push https://x-access-token:${{ secrets.PRIVATE_PAT }}@github.com/kanezikii/fgh_Renew.git HEAD:main
          else
            echo "⚪ Cookie 无变动，无需推送。"
          fi

      - name: 📸 上传现场截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "private_repo/artifacts/*.png"
          retention-days: 3
