name: FGH-Renew-Auto

on:
  workflow_dispatch:
  schedule:
    # 每天按预定时间执行 (UTC时间)
    - cron: '30 2,6,10,14,18,22 * * *'

jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    steps:
      - name: 🟢 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ 安装系统依赖与 Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb curl unzip

      - name: 📥 拉取私库代码 (kanezikii/fgh_Renew)
        run: |
          git clone https://x-access-token:${{ secrets.PRIVATE_PAT }}@github.com/kanezikii/fgh_Renew.git private_repo
          cd private_repo
          npm init -y
          npm install puppeteer-real-browser

      - name: 🚀 部署并启动全协议本地代理
        env:
          RAW_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          # 1. 探测配置类型并启动对应内核
          python3 - << 'EOF'
          import os, sys, json, base64, urllib.parse

          raw = os.environ.get("RAW_CONFIG", "").strip()
          if not raw:
              print("⚠️ 未配置代理 Secret，将直接使用直连模式。")
              sys.exit(0)

          # 情况 A: 原生 Xray JSON 配置 (包含 outbounds)
          if '"outbounds"' in raw:
              print("📦 识别为原生 Xray 配置文件")
              with open("xray_config.json", "w", encoding="utf-8") as f:
                  f.write(raw)
              with open("engine.type", "w") as f: f.write("xray")
              sys.exit(0)

          # 情况 B: 完整 Clash YAML
          if "proxies:" in raw:
              print("📦 识别为完整 Clash 配置文件")
              with open("clash_config.yaml", "w", encoding="utf-8") as f:
                  f.write(raw)
              with open("engine.type", "w") as f: f.write("mihomo")
              sys.exit(0)

          # 情况 C: 单节点分享链接 (VLESS / VMess / Hy2 / SS)
          proxy = None
          if raw.startswith("hysteria2://") or raw.startswith("hy2://"):
              u = urllib.parse.urlsplit(raw)
              q = urllib.parse.parse_qs(u.query)
              proxy = {"name": "PROXY_NODE", "type": "hysteria2", "server": u.hostname, "port": u.port or 443, "password": u.username or u.password or "", "sni": q.get("sni", [u.hostname])[0], "skip-cert-verify": q.get("insecure", ["0"])[0] in ["1", "true"]}
          elif raw.startswith("vless://"):
              u = urllib.parse.urlsplit(raw)
              q = urllib.parse.parse_qs(u.query)
              proxy = {"name": "PROXY_NODE", "type": "vless", "server": u.hostname, "port": u.port or 443, "uuid": u.username, "cipher": "auto", "network": q.get("type", ["tcp"])[0], "tls": q.get("security", [""])[0] in ["tls", "reality"], "udp": True}
              if q.get("security", [""])[0] == "reality":
                  proxy["reality-opts"] = {"public-key": q.get("pbk", [""])[0], "short-id": q.get("sid", [""])[0]}
                  proxy["client-fingerprint"] = q.get("fp", ["chrome"])[0]
              if "sni" in q: proxy["servername"] = q["sni"][0]
          elif raw.startswith("vmess://"):
              b64_str = raw[8:] + "=" * ((4 - len(raw[8:]) % 4) % 4)
              d = json.loads(base64.b64decode(b64_str).decode("utf-8"))
              proxy = {"name": "PROXY_NODE", "type": "vmess", "server": d.get("add"), "port": int(d.get("port")), "uuid": d.get("id"), "alterId": int(d.get("aid", 0)), "cipher": "auto", "network": d.get("net", "tcp"), "tls": d.get("tls") in ["tls", "1", True], "udp": True}
          elif raw.startswith("ss://"):
              u = urllib.parse.urlsplit(raw)
              raw_b64 = u.netloc + "=" * ((4 - len(u.netloc) % 4) % 4)
              decoded = base64.b64decode(raw_b64).decode("utf-8")
              userinfo, hostport = decoded.split("@", 1)
              method, password = userinfo.split(":", 1)
              server, port = hostport.split(":", 1)
              proxy = {"name": "PROXY_NODE", "type": "ss", "server": server, "port": int(port), "cipher": method, "password": password, "udp": True}

          if proxy:
              # 正确补齐 proxy-groups 策略组定义，彻底避免规则解析报错
              cfg = {
                  "mixed-port": 10808,
                  "allow-lan": False,
                  "mode": "rule",
                  "log-level": "info",
                  "proxies": [proxy],
                  "proxy-groups": [
                      {"name": "GLOBAL_PROXY", "type": "select", "proxies": ["PROXY_NODE"]}
                  ],
                  "rules": ["MATCH,GLOBAL_PROXY"]
              }
              with open("clash_config.json", "w", encoding="utf-8") as f:
                  json.dump(cfg, f, indent=2)
              with open("engine.type", "w") as f: f.write("mihomo")
              print("✅ 节点链接成功转换并补齐策略组！")
          EOF

          # 2. 启动对应内核并验证连通性
          ENGINE=$(cat engine.type 2>/dev/null || echo "none")
          if [ "$ENGINE" = "xray" ]; then
              wget -qO xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
              unzip -o xray.zip xray -d ./xray-bin
              chmod +x ./xray-bin/xray
              nohup ./xray-bin/xray run -c xray_config.json > proxy.log 2>&1 &
          elif [ "$ENGINE" = "mihomo" ]; then
              curl -sL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-linux-amd64-v1.19.2.gz | gzip -d > ./mihomo
              chmod +x ./mihomo
              CONFIG_FILE=$(ls clash_config.json clash_config.yaml 2>/dev/null | head -n 1)
              nohup ./mihomo -d . -f "$CONFIG_FILE" > proxy.log 2>&1 &
          fi

          sleep 3
          # 3. 严格验证代理端口
          if curl -s -x http://127.0.0.1:10808 -m 8 https://api.ip.sb/ip > /dev/null 2>&1 || curl -s --socks5 127.0.0.1:10808 -m 8 https://api.ip.sb/ip > /dev/null 2>&1; then
              echo "✅ 本地代理健康校验通过，端口 127.0.0.1:10808 就绪！"
          else
              echo "⚠️ 本地代理启动或连通性未通过，打印日志排错："
              cat proxy.log 2>/dev/null || true
          fi

      - name: 🚀 执行核心自动化脚本
        env:
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
          SERVER_ID: '5f39d742'
        run: |
          cd private_repo
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1600x24" node fgh_renew.js

      - name: 💾 同步最新 Cookie 回写至私有仓库
        if: always()
        run: |
          cd private_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet fgh_renew.js; then
            echo "🔄 检测到 Cookie 变动，自动同步到私库..."
            git add fgh_renew.js
            git commit -m "Auto: Update cookies [skip ci]"
            git push https://x-access-token:${{ secrets.PRIVATE_PAT }}@github.com/kanezikii/fgh_Renew.git HEAD:main
          else
            echo "⚪ Cookie 无变动，无需推送。"
          fi

      - name: 📸 上传现场截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "private_repo/artifacts/*.png"
          retention-days: 3
