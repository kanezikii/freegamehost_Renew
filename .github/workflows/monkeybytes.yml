name: MonkeyBytes

on:
  schedule:
    - cron: '0 1 * * *' # 每天北京时间 09:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: kanezikii/fgh_Renew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: |
          cp private/monkeybytes.py monkeybytes.py
          chmod +x monkeybytes.py
          ls -lh monkeybytes.py

      - name: 🐍 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🛡️ 启动 GOST 代理转发
        if: ${GOST_PROXY: ${{ secrets.GOST_PROXY }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' \
            | cut -d'"' -f4 \
            | tr -d 'v')

          echo "📦 GOST 版本: $VERSION"

          wget -q \
            "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"

          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"

          chmod +x gost

          nohup ./gost \
            -L http://:8080 \
            -F "$GOST_PROXY" \
            > gost.log 2>&1 &

          sleep 3

          echo "✅ GOST 已启动"

          if curl -fsS \
            -x http://127.0.0.1:8080 \
            https://api.ipify.org \
            > /tmp/public_ip.txt
          then
            IP=$(cat /tmp/public_ip.txt)
            echo "🌐 代理出口 IP: ${IP}"
          else
            echo "❌ GOST 代理测试失败"
            cat gost.log || true
            exit 1
          fi

      - name: 🤖 执行自动化脚本
        env:
          MONKEY_ACCOUNT: ${{ secrets.MONKEY_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          python -u monkeybytes.py
