name: MonkeyBytes

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 01:00 执行（对应北京时间 09:00）
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run:
    name: 执行 MonkeyBytes 续期
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================================================
      # 1. 拉取并准备私库脚本
      # ======================================================
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: kanezikii/fgh_Renew
          token: ${{ secrets.PRIVATE_PAT }}
          path: private

      - name: 📂 准备脚本
        run: |
          set -e
          test -f private/monkeybytes.py
          cp private/monkeybytes.py ./monkeybytes.py
          chmod +x ./monkeybytes.py
          echo "✅ monkeybytes.py 准备完成"
          ls -lh ./monkeybytes.py

      # ======================================================
      # 2. 安装 Python 依赖
      # ======================================================
      - name: 📦 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      # ======================================================
      # 3. 自动识别代理并启动 (sing-box 多协议引擎接管)[cite: 1]
      # ======================================================
      - name: 🛡️ 启动代理服务
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          set -Eeuo pipefail

          if [ -z "${GOST_PROXY:-}" ]; then
            echo "🌐 未配置 GOST_PROXY，使用直连模式"
            {
              echo "PROXY_TYPE=direct"
              echo "HTTP_PROXY="
              echo "HTTPS_PROXY="
            } >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$GOST_PROXY" =~ ^(hysteria2|hy2|vless|trojan|socks5|socks|http|https):// ]]; then
            echo "🔵 检测到标准代理链接，准备启动 sing-box"

            SB_TAG="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
            SB_VERSION="${SB_TAG#v}"
            echo "📦 sing-box 版本: ${SB_TAG}"

            curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_VERSION}-linux-amd64.tar.gz" -o sing-box.tar.gz
            mkdir -p sing-box-extract
            tar -xzf sing-box.tar.gz -C sing-box-extract
            SINGBOX_BIN="$(find sing-box-extract -type f -name sing-box -print -quit)"
            chmod +x "$SINGBOX_BIN"

            cat << 'EOF' > make_singbox.py
          import json
          import os
          import sys
          from urllib.parse import urlparse, parse_qs, unquote

          uri = os.environ.get("GOST_PROXY", "").strip()
          parsed = urlparse(uri)
          scheme = parsed.scheme.lower()

          server = parsed.hostname
          port = parsed.port
          user = unquote(parsed.username or "")
          password = unquote(parsed.password or "")
          params = parse_qs(parsed.query)

          sni = unquote(params.get("sni", [server or ""])[0])
          insecure = params.get("insecure", params.get("allowInsecure", ["0"]))[0].lower() in ("1", "true", "yes")

          outbound = None

          if scheme in ("hysteria2", "hy2"):
              auth_secret = user or password
              outbound = {
                  "type": "hysteria2",
                  "tag": "proxy-out",
                  "server": server,
                  "server_port": port,
                  "password": auth_secret,
                  "tls": {
                      "enabled": True,
                      "server_name": sni if sni else server,
                      "insecure": insecure,
                  },
              }
              obfs_type = params.get("obfs", [""])[0]
              obfs_password = params.get("obfs-password", [""])[0]
              if obfs_type:
                  outbound["obfs"] = {
                      "type": obfs_type,
                      "password": obfs_password,
                  }

          elif scheme == "vless":
              uuid = user
              security = params.get("security", ["none"])[0].lower()
              network = params.get("type", ["tcp"])[0].lower()
              host = unquote(params.get("host", [""])[0])
              path = unquote(params.get("path", ["/"])[0])
              fingerprint = params.get("fp", [""])[0]

              outbound = {
                  "type": "vless",
                  "tag": "proxy-out",
                  "server": server,
                  "server_port": port,
                  "uuid": uuid,
              }
              if security == "tls":
                  outbound["tls"] = {
                      "enabled": True,
                      "server_name": sni if sni else server,
                      "insecure": insecure,
                  }
                  if fingerprint:
                      outbound["tls"]["utls"] = {
                          "enabled": True,
                          "fingerprint": fingerprint,
                      }
              if network == "ws":
                  transport = {"type": "ws", "path": path}
                  if host:
                      transport["headers"] = {"Host": host}
                  outbound["transport"] = transport

          elif scheme == "trojan":
              outbound = {
                  "type": "trojan",
                  "tag": "proxy-out",
                  "server": server,
                  "server_port": port,
                  "password": user or password,
                  "tls": {
                      "enabled": True,
                      "server_name": sni if sni else server,
                      "insecure": insecure,
                  },
              }
              network = params.get("type", ["tcp"])[0].lower()
              if network == "ws":
                  host = unquote(params.get("host", [""])[0])
                  path = unquote(params.get("path", ["/"])[0])
                  transport = {"type": "ws", "path": path}
                  if host:
                      transport["headers"] = {"Host": host}
                  outbound["transport"] = transport

          elif scheme in ("socks5", "socks"):
              outbound = {
                  "type": "socks",
                  "tag": "proxy-out",
                  "server": server,
                  "server_port": port,
              }
              if user:
                  outbound["username"] = user
              if password:
                  outbound["password"] = password

          elif scheme in ("http", "https"):
              outbound = {
                  "type": "http",
                  "tag": "proxy-out",
                  "server": server,
                  "server_port": port,
              }
              if scheme == "https":
                  outbound["tls"] = {
                      "enabled": True,
                      "server_name": sni if sni else server,
                      "insecure": insecure,
                  }
              if user:
                  outbound["username"] = user
              if password:
                  outbound["password"] = password

          if not outbound:
              print(f"❌ 不支持的节点协议: {scheme}")
              sys.exit(1)

          config = {
              "log": {"level": "warn"},
              "inbounds": [
                  {
                      "type": "mixed",
                      "tag": "proxy-in",
                      "listen": "127.0.0.1",
                      "listen_port": 10808,
                  }
              ],
              "outbounds": [
                  outbound,
                  {"type": "direct", "tag": "direct"},
              ],
          }

          with open("sing-box.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          print(f"✅ sing-box.json 配置生成成功 [{scheme.upper()}] (监听 127.0.0.1:10808)")
          EOF

            python3 make_singbox.py

            echo "🔍 检查 sing-box 配置"
            "$SINGBOX_BIN" check -c sing-box.json

            echo "🚀 启动 sing-box"
            nohup "$SINGBOX_BIN" run -c sing-box.json > sing-box.log 2>&1 &
            echo "$!" > sing-box.pid
            sleep 3

            if ! kill -0 "$(<sing-box.pid)" 2>/dev/null; then
              echo "❌ sing-box 启动失败"
              cat sing-box.log || true
              exit 1
            fi

            echo "🔎 测试节点出口连通性"
            if curl -fsSL --proxy http://127.0.0.1:10808 https://api.ipify.org -o /tmp/proxy_ip.txt; then
              echo "✅ 代理连接成功，出口 IP: $(cat /tmp/proxy_ip.txt)"
            else
              echo "❌ 代理测试失败"
              cat sing-box.log || true
              exit 1
            fi

            {
              echo "PROXY_TYPE=sing-box"
              echo "HTTP_PROXY=http://127.0.0.1:10808"
              echo "HTTPS_PROXY=http://127.0.0.1:10808"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          echo "🟢 检测到特殊代理，准备启动 GOST 转发"
          GOST_TAG="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/ginuerzh/gost/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          GOST_VERSION="${GOST_TAG#v}"
          echo "📦 GOST 版本: ${GOST_VERSION}"

          curl -fL --retry 3 --retry-delay 2 "https://github.com/ginuerzh/gost/releases/download/${GOST_TAG}/${GOST_ARCHIVE:-gost_${GOST_VERSION}_linux_amd64.tar.gz}" -o gost.tar.gz
          tar -xzf gost.tar.gz
          GOST_BIN="$(find . -maxdepth 3 -type f -name gost -print -quit)"
          chmod +x "$GOST_BIN"

          echo "🚀 启动 GOST 转发"
          nohup "$GOST_BIN" -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          echo "$!" > gost.pid
          sleep 3

          if ! kill -0 "$(<gost.pid)" 2>/dev/null; then
            echo "❌ GOST 启动失败"
            cat gost.log || true
            exit 1
          fi

          echo "🔎 测试 GOST 出口连通性"
          if curl -fsSL --proxy http://127.0.0.1:8080 https://api.ipify.org -o /tmp/proxy_ip.txt; then
            echo "✅ GOST 代理连接成功，出口 IP: $(cat /tmp/proxy_ip.txt)"
          else
            echo "❌ GOST 代理测试失败"
            cat gost.log || true
            exit 1
          fi

          {
            echo "PROXY_TYPE=gost"
            echo "HTTP_PROXY=http://127.0.0.1:8080"
            echo "HTTPS_PROXY=http://127.0.0.1:8080"
          } >> "$GITHUB_ENV"

      # ======================================================
      # 4. 执行自动化续期脚本 (注入账号密码与 PAT)
      # ======================================================
      - name: 🤖 执行自动化脚本
        env:
          MONKEY_ACCOUNT: ${{ secrets.MONKEY_ACCOUNT }}
          MONKEY_EMAIL: ${{ secrets.MONKEY_EMAIL }}
          MONKEY_PASSWORD: ${{ secrets.MONKEY_PASSWORD }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT_TOKEN }}#${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          echo "=========================================="
          echo "🐒 MonkeyBytes 任务运行中"
          echo "代理类型: ${PROXY_TYPE:-direct}"
          echo "代理地址: ${HTTP_PROXY:-直连模式}"
          echo "=========================================="
          python3 -u monkeybytes.py

      # ======================================================
      # 5. 彻底清理后台进程与临时文件
      # ======================================================
      - name: 🧹 清理代理与后台进程
        if: always()
        run: |
          echo "🧹 正在彻底清理后台代理进程..."
          if [ -f sing-box.pid ]; then kill -9 "$(<sing-box.pid)" 2>/dev/null || true; fi
          if [ -f gost.pid ]; then kill -9 "$(<gost.pid)" 2>/dev/null || true; fi
          pkill -9 -f sing-box 2>/dev/null || true
          pkill -9 -f gost 2>/dev/null || true
          rm -f sing-box.pid gost.pid sing-box.log gost.log make_singbox.py /tmp/proxy_ip.txt || true
          echo "✅ 进程与临时文件清理完成"

      # ======================================================
      # 6. 清理旧工作流历史记录 (只保留本次运行)
      # ======================================================
      - name: 🗑️ 清理旧工作流历史记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
        run: |
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          echo "🧹 正在清理旧记录（仅保留当前这一次）..."
          OLD_RUNS=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id") || true

          if [ -n "$OLD_RUNS" ]; then
            for run_id in $OLD_RUNS; do
              echo "🗑️ 正在删除历史 Run ID: $run_id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$run_id" >/dev/null 2>&1 || true
            done
            echo "✅ 历史工作流运行记录已全部清理完毕，仅保留当前记录"
          else
            echo "ℹ️ 没有发现需要清理的旧记录"
          fi
