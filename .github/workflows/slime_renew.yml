name: Slime Auto Renew

on:
  schedule:
    # 每天跑一次（你可以根据实际到期时间自己改 cron）
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  renew-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 拉取私有仓库代码
        uses: actions/checkout@v4
        with:
          # 指定你的私库路径
          repository: kanezikii/fgh_Renew/slime_renew.py
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装浏览器自动化依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 🚀 执行自动续期脚本
        env:
          # 把 Secret 里的 cookie 值传给 Python 脚本
          CONNECT_SID: ${{ secrets.CONNECT_SID }}
        # 运行你私库里的这个指定文件
        run: python slime_renew.py

      - name: 📸 提取执行结果截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-screenshot
          path: renew_result.png
          retention-days: 3
