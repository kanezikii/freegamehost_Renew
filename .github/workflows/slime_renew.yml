name: Slime Auto Renew

on:
  schedule:
    - cron: '0 13 */2 * *'
  workflow_dispatch:

jobs:
  renew-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          repository: kanezikii/fgh_Renew
          token: ${{ secrets.PRIVATE_PAT }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright pynacl
          playwright install chromium

      - name: 🌐 启动通用代理节点 (sing-box)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SING_BOX_CONFIG: ${{ secrets.SING_BOX_CONFIG }}
        run: |
          # 1. 动态生成 sing-box 配置
          python proxy_setup.py

          # 2. 下载并安装 sing-box 静态二进制包
          SING_BOX_VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VER}/sing-box-${SING_BOX_VER}-linux-amd64.tar.gz" -O sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box

          # 3. 后台启动代理
          ./sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
          sleep 5

          # 4. 测试本地 SOCKS5 连通性
          curl -s -x socks5://127.0.0.1:10808 https://ipinfo.io/json || (cat sing-box.log && exit 1)

      - name: 🚀 执行自动续期 + 更新 Cookie
        env:
          CONNECT_SID: ${{ secrets.CONNECT_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: |
          export GH_OWNER=$(echo "$GH_OWNER" | tr -d '\n\r ')
          export GH_REPO=$(echo "$GH_REPO" | tr -d '\n\r ')
          echo "使用仓库: $GH_OWNER/$GH_REPO"
          python slime_renew.py

      - name: 📸 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-screenshot
          path: renew_result.png
          retention-days: 3

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f hysteria || true
          pkill -f chrome || true
          rm -rf sing-box* hy2.yaml hysteria

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER=$(echo "${{ secrets.GH_OWNER }}" | tr -d '\n\r ')
          REPO=$(echo "${{ secrets.GH_REPO }}" | tr -d '\n\r ')
          runs=$(gh run list --repo "$OWNER/$REPO" --workflow="Slime Auto Renew" --limit=100 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          if [ -n "$runs" ]; then
            count=0
            for run_id in $runs; do
              count=$((count + 1))
              if [ $count -gt 1 ]; then
                gh run delete "$run_id" --repo "$OWNER/$REPO" || true
              fi
            done
          fi
