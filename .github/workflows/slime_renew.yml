name: Slime Auto Renew

on:
  schedule:
    # 每 6 小时自动跑一次检查剩余时长
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  renew-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 拉取私有仓库代码
        uses: actions/checkout@v4
        with:
          # 【重要修正】只写仓库路径，不写文件名
          repository: kanezikii/fgh_Renew
          token: ${{ secrets.PRIVATE_PAT }}

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装浏览器自动化依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 🚀 执行自动续期脚本
        env:
          # 把 Secret 里的 session 值传给 Python
          CONNECT_SID: ${{ secrets.CONNECT_SID }}
        run: python slime_renew.py

      - name: 📸 提取执行结果截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-screenshot
          path: renew_result.png
          retention-days: 3
