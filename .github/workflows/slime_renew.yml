name: Slime Auto Renew

on:
  schedule:
    - cron: '0 */11 * * *'
  workflow_dispatch:

jobs:
  renew-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          repository: kanezikii/fgh_Renew
          token: ${{ secrets.PRIVATE_PAT }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright pynacl
          playwright install chromium

      - name: 🚀 执行自动续期 + 更新 Cookie
        env:
          CONNECT_SID: ${{ secrets.CONNECT_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # 强制去掉可能存在的换行符和空格
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: |
          # 清理环境变量里的换行符（非常关键）
          export GH_OWNER=$(echo "$GH_OWNER" | tr -d '\n\r ')
          export GH_REPO=$(echo "$GH_REPO" | tr -d '\n\r ')
          echo "使用仓库: $GH_OWNER/$GH_REPO"
          python slime_renew.py

      - name: 📸 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-screenshot
          path: renew_result.png
          retention-days: 3

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      # ==================== 修复后的清理步骤 ====================
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # 使用你权限最高的 PAT
        run: |
          # 清理可能存在的换行符
          OWNER=$(echo "${{ secrets.GH_OWNER }}" | tr -d '\n\r ')
          REPO=$(echo "${{ secrets.GH_REPO }}" | tr -d '\n\r ')
          
          echo "正在清理仓库: $OWNER/$REPO"
          
          runs=$(gh run list \
            --repo "$OWNER/$REPO" \
            --workflow="Slime Auto Renew" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId' 2>/dev/null || true)
          
          if [ -z "$runs" ]; then
            echo "未找到可清理的运行记录"
            exit 0
          fi
          
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除旧运行记录: $run_id"
              gh run delete "$run_id" --repo "$OWNER/$REPO" || true
            fi
          done
          
          echo "清理完成，仅保留最新 1 条记录"
