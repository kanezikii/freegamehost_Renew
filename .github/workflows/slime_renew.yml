name: Slime Auto Renew

on:
  schedule:
    - cron: '0 */11 * * *'
  workflow_dispatch:

jobs:
  renew-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          repository: kanezikii/fgh_Renew
          token: ${{ secrets.PRIVATE_PAT }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright pynacl pyyaml
          playwright install chromium

      - name: 🌐 启动通用核心代理引擎 (支持市面99%协议 & 订阅链接)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "❌ 错误: 未配置 PROXY_URL Secret"
            exit 1
          fi
          
          echo "⬇️ 正在准备终极代理引擎 (Mihomo/Clash.Meta)..."
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gzip -d mihomo-linux-amd64-v1.18.3.gz
          mv mihomo-linux-amd64-v1.18.3 mihomo
          chmod +x mihomo

          # 判断传入的是 订阅链接 还是 单节点链接
          if [[ "$PROXY_URL" == http* ]]; then
            echo "🔗 检测到订阅链接，开始使用 Subconverter 解析..."
            wget -q https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
            tar -zxf subconverter_linux64.tar.gz
            cd subconverter
            ./subconverter >/dev/null 2>&1 &
            SUB_PID=$!
            cd ..
            sleep 2
            
            encoded_url=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['PROXY_URL'], safe=''))")
            curl -s "http://127.0.0.1:25500/sub?target=clash&url=${encoded_url}&insert=false" > raw_config.yaml
            kill $SUB_PID || true
            
            if ! grep -q "proxies:" raw_config.yaml; then
              echo "❌ 订阅解析失败！可能是订阅链接不可达。"
              cat raw_config.yaml
              exit 1
            fi
            
            # 使用 Python 提取解析后的 proxies
            python3 -c '
            import yaml, sys
            with open("raw_config.yaml", "r", encoding="utf-8") as f:
                data = yaml.safe_load(f)
            proxies = data.get("proxies", [])
            with open("proxies.json", "w") as f:
                import json
                json.dump(proxies, f)
            '
          else
            echo "🔗 检测到单节点链接，直接通过 Mihomo proxy-providers 解析..."
            # 单节点不通过 Subconverter，直接写入 provider 文件
            echo "$PROXY_URL" > node_list.txt
          fi

          # 生成最终的 Mihomo 配置文件
          python3 -c '
          import yaml, os, json
          
          config = {
              "port": 7890,
              "socks-port": 10808,
              "allow-lan": True,
              "mode": "rule",
              "log-level": "info",
              "proxies": [],
              "proxy-providers": {},
              "proxy-groups": [
                  {
                      "name": "AUTO-SELECT",
                      "type": "url-test",
                      "proxies": [],
                      "use": [],
                      "url": "http://www.gstatic.com/generate_204",
                      "interval": 300,
                      "tolerance": 50
                  }
              ],
              "rules": ["MATCH,AUTO-SELECT"]
          }
          
          proxy_url = os.environ.get("PROXY_URL", "")
          
          if proxy_url.startswith("http"):
              # 如果是订阅链接，读取前面解析好的 proxies.json
              try:
                  with open("proxies.json", "r") as f:
                      proxies = json.load(f)
                      config["proxies"] = proxies
                      config["proxy-groups"][0]["proxies"] = [p["name"] for p in proxies]
                      print(f"✅ 成功加载 {len(proxies)} 个订阅节点！")
              except Exception as e:
                  print(f"❌ 读取订阅节点失败: {e}")
                  sys.exit(1)
          else:
              # 如果是单节点，使用 provider 直接读取外部 txt
              config["proxy-providers"]["single_node"] = {
                  "type": "file",
                  "path": "./node_list.txt",
                  "health-check": {"enable": True, "url": "http://www.gstatic.com/generate_204", "interval": 300}
              }
              config["proxy-groups"][0]["use"] = ["single_node"]
              print("✅ 成功配置单节点解析！")

          with open("config.yaml", "w", encoding="utf-8") as f:
              yaml.dump(config, f, allow_unicode=True, sort_keys=False)
          '

          # 启动 Mihomo 代理引擎
          ./mihomo -f config.yaml > mihomo.log 2>&1 &
          sleep 4
          
          # 检查端口是否成功监听
          if ! nc -z 127.0.0.1 10808; then
            echo "❌ 代理引擎启动失败或未监听 10808 端口，请检查配置或节点格式。"
            cat mihomo.log
            exit 1
          fi
          
          echo "✅ 代理引擎已成功在本地 10808 端口启动！"

      - name: 🚀 执行自动续期 + 更新 Cookie
        env:
          CONNECT_SID: ${{ secrets.CONNECT_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # 强制去掉可能存在的换行符和空格
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: |
          # 清理环境变量里的换行符（非常关键）
          export GH_OWNER=$(echo "$GH_OWNER" | tr -d '\n\r ')
          export GH_REPO=$(echo "$GH_REPO" | tr -d '\n\r ')
          echo "使用仓库: $GH_OWNER/$GH_REPO"
          python slime_renew.py

      - name: 📸 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-screenshot
          path: renew_result.png
          retention-days: 3

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f mihomo || true
          pkill -f subconverter || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -rf subconverter* raw_config.yaml config.yaml proxy_node.txt mihomo mihomo.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # 使用你权限最高的 PAT
        run: |
          # 清理可能存在的换行符
          OWNER=$(echo "${{ secrets.GH_OWNER }}" | tr -d '\n\r ')
          REPO=$(echo "${{ secrets.GH_REPO }}" | tr -d '\n\r ')
          
          echo "正在清理仓库: $OWNER/$REPO"
          
          runs=$(gh run list \
            --repo "$OWNER/$REPO" \
            --workflow="Slime Auto Renew" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId' 2>/dev/null || true)
          
          if [ -z "$runs" ]; then
            echo "未找到可清理的运行记录"
            exit 0
          fi
          
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除旧运行记录: $run_id"
              gh run delete "$run_id" --repo "$OWNER/$REPO" || true
            fi
          done
          
          echo "清理完成，仅保留最新 1 条记录"
